# DEPRECATED: Deployment now uses .github/workflows/deploy-cloud-run.yml
# This file is kept for reference only. Do NOT use for production deploys.
steps:
  - name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - '--destination=gcr.io/$PROJECT_ID/present-health-dpc:$COMMIT_SHA'
      - '--destination=gcr.io/$PROJECT_ID/present-health-dpc:latest'
      - '--cache=true'
      - '--cache-ttl=168h'
      - '--build-arg=DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy'
      - '--build-arg=NEXT_PUBLIC_BUILD_ID=$COMMIT_SHA'
      - '--build-arg=NEXT_PUBLIC_BUILD_TIME=$BUILD_ID'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'present-health-dpc'
      - '--image'
      - 'gcr.io/$PROJECT_ID/present-health-dpc:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--update-env-vars'
      - 'DATABASE_URL=SET_VIA_GITHUB_SECRETS,NEXTAUTH_SECRET=SET_VIA_GITHUB_SECRETS,NEXTAUTH_URL=https://presenthealthmd.com'
      - '--add-cloudsql-instances'
      - 'present-health-dpc-2025:us-central1:present-health-db'

options:
  logging: CLOUD_LOGGING_ONLY
